<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaslands Dashboard Creator</title>
  <link rel="stylesheet" href="css/style.css">
  <link id="layoutStylesheet" rel="stylesheet" href="css/88x64.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#eee">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Dirt&family=Agdasima:wght@400;700&family=Stardos+Stencil:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>
  <div id="headerDiv" class="noprint header">
    <button type="button" id="addTeamButton">Add Team</button>
    <button type="button" id="saveButton">Save</button>
    <button type="button" id="loadButton">Load</button>
    <input type="file" id="fallbackLoadInput" title="fallbackLoadInput" accept=".json">
    <button type="button" id="d6">Roll Dice</button>
  </div>

  <div id="editDiv">
  </div>

  <div id="printDiv">
    <div class="noprint header">
      <button type="button" id="closePrintButton">Close</button>
      <button type="button" id="printButton">Print</button>
      <button type="button" id="88x64">3D Print Template Size (88x64)</button>
      <button type="button" id="100x70">TK Template Size (100x70)</button>
      <a href="https://www.thingiverse.com/thing:4938687" target="_blank" rel="noopener">3D Print File</a>
    </div>
    <div id="printContent"></div>
  </div>

  <div id="diceDiv">
  </div>

  <div id="backgroundLoader">
    <img src="/img/vehicle-card-background.png" alt="Card background">
    <img src="/img/vehicle-image-frame.png" alt="Vehicle image frame">
  </div>
  <script type="module" src="js/app.js"></script>
</body>

</html>
