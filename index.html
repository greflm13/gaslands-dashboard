<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="">

  <meta property="og:title" content="">
  <meta property="og:type" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta property="og:image:alt" content="">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#fafafa">
</head>

<body>

  <!-- ================= HEADER / CONTROLS ================= -->
  <div id="headerDiv" class="noprint header">
    <button class="addButton" onclick="addTeam()">Add Team</button>
    <button onclick="saveToFile()">Save</button>
    <button onclick="loadFromDialog()">Load</button>
    <input type="file" id="fallbackLoadInput" style="display:none" onchange="loadFromFileInput(event)">
  </div>

  <!-- ================= EDIT VIEW ================= -->
  <div id="editDiv">
    <!-- Teams are rendered here by render() -->
  </div>

  <!-- ================= PRINT VIEW ================= -->
  <div id="printDiv" style="display:none;">
    <div class="noprint header" style="margin-bottom:10px;">
      <button onclick="closePrintPreview()">Close Print Preview</button>
      <button onclick="window.print()">Print</button>
    </div>
    <div id="printContent"></div>
    <!-- Printable team content is rendered here by render() -->
  </div>


  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
